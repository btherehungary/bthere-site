<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bthere – Hamarosan találkozunk</title>
<meta name="description" content="Bthere – Szervezz eseményeket, jelentkezz és légy ott!">
<style>
:root{--bg:#070819;--panel:#15102c;--purple:#652cff;--pink:#ef3dbb;--orange:#ff7b43;--text:#fffaf3;--muted:#cbc8d8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;overflow-x:hidden}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:
radial-gradient(circle at 8% 18%,rgba(239,61,187,.22),transparent 28%),
radial-gradient(circle at 88% 12%,rgba(101,44,255,.24),transparent 30%),
radial-gradient(circle at 83% 88%,rgba(255,123,67,.13),transparent 25%),
linear-gradient(145deg,#050616 0%,#0b0820 48%,#11112c 100%)}
.page:before,.page:after{content:"";position:absolute;border-radius:50%;filter:blur(12px);pointer-events:none}
.page:before{width:300px;height:300px;left:-155px;bottom:-150px;background:linear-gradient(145deg,var(--purple),var(--pink));opacity:.55}
.page:after{width:280px;height:280px;right:-135px;top:-135px;background:linear-gradient(145deg,var(--pink),var(--orange));opacity:.45}
.card{position:relative;z-index:1;width:min(850px,100%);text-align:center;padding:38px 48px 34px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.04));box-shadow:0 28px 75px rgba(0,0,0,.32);backdrop-filter:blur(14px)}
.logo-shell{display:flex;align-items:center;justify-content:center;width:min(500px,82%);margin:0 auto 18px;padding:12px 18px;background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.logo-shell img{display:block;width:100%;height:auto;max-height:122px;object-fit:contain}
.kicker{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:100%;margin:0 auto 20px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#ece9f4}
.dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:0 0 14px rgba(239,61,187,.7)}
h1{margin:0;font-size:clamp(36px,5.2vw,62px);line-height:1.02;letter-spacing:-.045em;font-weight:850}
.accent{height:4px;width:80px;border-radius:999px;margin:24px auto 0;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange))}
.tagline{margin:22px 0 0;font-size:clamp(19px,2.3vw,28px);font-weight:780;letter-spacing:-.025em}
.sep{opacity:.45;padding:0 .22em}
.desc{max-width:700px;margin:22px auto 0;font-size:clamp(15px,1.35vw,18px);line-height:1.58;color:var(--muted)}
.footer{margin-top:24px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.48)}
@media (max-width:640px){
 .page{padding:14px}
 .card{padding:28px 18px 25px;border-radius:24px}
 .logo-shell{width:94%;padding:10px 12px;border-radius:16px;margin-bottom:16px}
 .logo-shell img{max-height:88px}
 .kicker{margin-bottom:18px;font-size:11px}
 h1{font-size:clamp(34px,11vw,48px)}
 .tagline{line-height:1.35}
