<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bthere — hamarosan</title><style>
:root{--bg:#09090d;--ink:#111018;--muted:#74717d}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#faf9fc;-webkit-font-smoothing:antialiased}body{overflow-x:hidden}
.hero{height:48svh;min-height:400px;max-height:495px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(123,44,255,.09),transparent 29%),#09090d}
.topbar{position:absolute;z-index:30;left:18px;right:18px;top:max(17px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.mini{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;letter-spacing:-.03em}.mini img{width:26px;height:31px;object-fit:contain}
.soon{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#b2afb8;border:1px solid rgba(255,255,255,.13);border-radius:99px;padding:8px 11px;font-weight:800;background:rgba(255,255,255,.025);backdrop-filter:blur(8px)}
.field{position:absolute;inset:0;z-index:4}.pin{position:absolute;width:25px;height:25px;opacity:0;transform:translate(-50%,-50%) scale(.05);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.85,.25,1.32);filter:drop-shadow(0 6px 10px rgba(0,0,0,.27))}
.pin:before{content:"";position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c)}.pin:after{content:"";position:absolute;left:9px;top:9px;width:7px;height:7px;border-radius:50%;background:white}
.pin.on{opacity:.96;transform:translate(-50%,-50%) scale(var(--s))}.pin.fresh{animation:pop .65s ease}@keyframes pop{45%{filter:drop-shadow(0 0 16px var(--c))}}
.brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;text-align:center;pointer-events:none;text-shadow:0 5px 20px #09090d}
.brand img{width:clamp(80px,19vw,112px);display:block;margin:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.38))}.brand .word{font-size:clamp(42px,10vw,58px);line-height:.95;font-weight:880;letter-spacing:-.067em;color:#fff;margin-top:7px}
.tagline{position:absolute;z-index:20;left:50%;bottom:35px;transform:translateX(-50%);color:#a6a2ad;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.curve{height:45px;background:#faf9fc;border-radius:50% 50% 0 0/100% 100% 0 0;margin-top:-24px;position:relative;z-index:25}
main{max-width:980px;margin:auto;padding:23px 17px 74px}.intro{max-width:680px;margin:0 auto;text-align:center;padding:0 6px 32px}
.kicker{font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#9a96a1;margin-bottom:13px}h1{font-size:clamp(32px,8.5vw,52px);line-height:1.01;letter-spacing:-.058em;margin:0 0 15px}
.grad{background:linear-gradient(90deg,#7b2cff,#ed329f 54%,#ff8b3d);-webkit-background-clip:text;background-clip:text;color:transparent}.intro p{font-size:16px;line-height:1.53;color:var(--muted);max-width:550px;margin:auto}
.choices{display:grid;gap:12px}.card{position:relative;background:#fff;border:1px solid #eae8ee;border-radius:23px;padding:21px 45px 21px 22px;box-shadow:0 12px 36px rgba(30,20,48,.055);min-height:142px;transition:transform .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-2px);border-color:#dcd8e3}.card:before{content:"";position:absolute;left:0;top:21px;bottom:21px;width:3px;border-radius:4px;background:var(--a)}.card:nth-child(1){--a:#7b2cff}.card:nth-child(2){--a:#ed329f}.card:nth-child(3){--a:#ff8b3d}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--a);margin:0 0 8px 8px}.card h2{font-size:20px;letter-spacing:-.035em;margin:0 0 8px 8px}.card p{font-size:14px;line-height:1.48;color:#6d6975;margin:0 0 0 8px}.arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;color:#b9b5c0}
.foot{text-align:center;color:#aaa6af;font-size:11px;margin-top:26px}
@media(min-width:760px){.hero{height:52vh}.choices{grid-template-columns:repeat(3,1fr)}.card{min-height:180px}}

.coming-main{max-width:900px;margin:0 auto;padding:34px 20px 68px}
.coming-copy{text-align:center;max-width:760px;margin:0 auto}
.coming-copy h1{font-size:clamp(36px,7vw,60px);line-height:1.02;letter-spacing:-.055em;margin:0;color:#111018;font-weight:880}
.accent{width:76px;height:4px;border-radius:999px;background:linear-gradient(90deg,#7b2cff,#ed329f 55%,#ff8b3d);margin:22px auto 22px}
.coming-copy h2{font-size:clamp(20px,3.2vw,28px);line-height:1.25;letter-spacing:-.025em;margin:0;color:#191721;font-weight:820}
.coming-copy h2 span{color:#aaa5b1;padding:0 .2em;font-weight:600}
.coming-copy p{font-size:clamp(15px,2vw,18px);line-height:1.62;color:#74717d;max-width:680px;margin:22px auto 0}
@media(max-width:600px){.coming-main{padding:28px 18px 52px}.coming-copy h2 span{padding:0 .08em}.hero{min-height:390px}}
</style></head><body>

<main class="coming-main">
  <section class="coming-copy">
    <h1>Hamarosan találkozunk</h1>
    <div class="accent"></div>
    <h2>Szervezz <span>–</span> Jelentkezz <span>–</span> Légy ott!</h2>
    <p>Szervezz eseményeket, vagy válogass a közeledben lévő események közül, amiket pont olyan felhasználók szerveztek, mint Te! A Bthere közösségi appal megszűnnek az unalmas esték!</p>
  </section>
</main>
<script>
const field=document.getElementById('field');
const colors=['#7B2CFF','#9637F5','#C13BFF','#ED329F','#FF4F91','#FF5D78','#FF8B3D','#FFAA3D','#425CFF','#4F7CFF','#6558FF','#2F9BFF'];
const cols=8, rows=7, pins=[], active=new Set();

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// Stratified randomness: organic placement, but no ugly rows or large empty holes.
for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
    let x=((c+.16+Math.random()*.68)/cols)*100;
    let y=((r+.13+Math.random()*.74)/rows)*100;
    // Reserve the upper-left brand area so pins never visually interfere with it.
    if(x<30 && y<18){ y=20+Math.random()*8; }
    const p=document.createElement('i');
    p.className='pin';
    p.style.left=x+'%';
    p.style.top=y+'%';
    p.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);
    const q=Math.random();
    const scale=q<.20 ? (.62+Math.random()*.18) :
                q<.82 ? (.86+Math.random()*.28) :
                         (1.18+Math.random()*.38);
    p.style.setProperty('--s',scale.toFixed(2));
    p.style.zIndex=q<.23?3:q<.84?5:7;
    field.appendChild(p);
    pins.push(p);
  }
}

function shuffled(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function show(i){
  active.add(i);
  pins[i].classList.add('on','fresh');
  setTimeout(()=>pins[i].classList.remove('fresh'),650);
}
function hide(i){
  active.delete(i);
  pins[i].classList.remove('on','fresh');
}

async function cycle(){
  while(true){
    // A short clean black moment with only the logo.
    await sleep(850);

    const order=shuffled(pins.map((_,i)=>i));
    const target=42+Math.floor(Math.random()*5); // 42–46 events

    // Start slowly: 1, 2, 3... then accelerate into a fuller field.
    let shown=0;
    while(shown<target){
      let batch;
      if(shown<3) batch=1;
      else if(shown<10) batch=Math.random()<.55?1:2;
      else if(shown<26) batch=2+Math.floor(Math.random()*2);
      else batch=3+Math.floor(Math.random()*3);

      for(let k=0;k<batch && shown<target;k++){
        show(order[shown++]);
        await sleep(35+Math.random()*65);
      }
      await sleep(shown<4 ? 380 : shown<11 ? 190 : shown<27 ? 105 : 65);
    }

    // Let the full "many things are happening" image breathe.
    await sleep(1500);

    // Clear in irregular little waves, visibly returning to zero.
    const removal=shuffled([...active]);
    let gone=0;
    while(gone<removal.length){
      const left=removal.length-gone;
      const batch=left>24 ? 4+Math.floor(Math.random()*3) :
                  left>10 ? 3+Math.floor(Math.random()*3) :
                            2+Math.floor(Math.random()*2);
      for(let k=0;k<batch && gone<removal.length;k++){
        hide(removal[gone++]);
        await sleep(28+Math.random()*42);
      }
      await sleep(60+Math.random()*90);
    }
  }
}
cycle();
</script></body></html><style>
